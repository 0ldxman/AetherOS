{% extends "admin/base_site.html" %}

{% block content %}
<p>Вернуть карту «{{ scene.title }}» к состоянию от {{ revision.saved_at }}?</p>
<p>В снимке пометок: {{ features }}. Текущее состояние сохранится в истории, его можно будет вернуть так же.</p>
<form method="post">
  {% csrf_token %}
  <input type="submit" value="Восстановить" class="default">
  <a href="{{ change_url }}" class="button cancel-link">Отмена</a>
</form>
{% endblock %}
