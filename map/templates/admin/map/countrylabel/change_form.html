{% extends "admin/change_form.html" %}

{% block after_field_sets %}
<div id="aether-map-picker">
  <p class="help">
    Кликните по карте, чтобы поставить точку: долгота и широта заполнятся сами.
    Числа можно править и руками, точка на карте сдвинется.
  </p>
  <iframe id="aether-map-frame" src="{% url 'map:index' %}?pick=1" title="Карта"></iframe>
</div>

<style>
  #aether-map-picker { margin: 16px 0; }
  #aether-map-frame {
    display: block;
    width: 100%;
    height: 520px;
    border: 1px solid var(--border-color, #ccc);
    background: #05070a;
  }
</style>

<script>
(function () {
  const frame = document.getElementById('aether-map-frame');
  const lngInput = document.getElementById('id_lng');
  const latInput = document.getElementById('id_lat');

  function readPoint() {
    const lng = parseFloat(String(lngInput.value).replace(',', '.'));
    const lat = parseFloat(String(latInput.value).replace(',', '.'));
    return Number.isFinite(lng) && Number.isFinite(lat) ? { lng, lat } : null;
  }

  // Отправляет карте текущие значения полей (или просит убрать маркер)
  function sendPoint() {
    const p = readPoint();
    frame.contentWindow.postMessage(
      { type: 'aether-map-set', lng: p ? p.lng : null, lat: p ? p.lat : null },
      window.location.origin
    );
  }

  window.addEventListener('message', (e) => {
    if (e.origin !== window.location.origin || e.source !== frame.contentWindow) return;
    const d = e.data || {};

    if (d.type === 'aether-map-pick') {
      lngInput.value = d.lng.toFixed(4);
      latInput.value = d.lat.toFixed(4);
    } else if (d.type === 'aether-map-ready') {
      sendPoint();
    }
  });

  lngInput.addEventListener('input', sendPoint);
  latInput.addEventListener('input', sendPoint);
  frame.addEventListener('load', sendPoint);
})();
</script>
{% endblock %}
