{% extends "ui/base.html" %}
{% load static %}

{% block title %}Aether OS / World{% endblock %}

{% block css %}
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <link href="{% static 'map.css' %}" rel="stylesheet">
  <link href="{% static 'timeline.css' %}" rel="stylesheet">
{% endblock %}

{% block body %}
  <div id="map"></div>
  <div id="mode-panel">
    <div class="title">map.mode</div>
    <button type="button" data-mode="political">political</button>
    <button type="button" data-mode="physical">physical</button>
  </div>
{% endblock %}

{% block js %}
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
  <script>
    const ISLANDS_URL = "{% static 'data/aether_lands.geojson' %}";
    const ADM1_PMTILES_URL = "{% static 'data/aether_provinces.pmtiles' %}";
    const PROVINCE_COLORS_URL = "{% url 'map:province_colors' %}";
    const COUNTRY_LABELS_URL = "{% url 'map:country_labels' %}";
    const TIMELINE_URL = "{% url 'map:timeline_dates' %}";
  </script>
  <script src="{% static 'map.js' %}"></script>
  <script src="{% static 'timeline.js' %}"></script>
{% endblock %}
