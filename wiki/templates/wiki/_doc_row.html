<tr{% if not d.open %} class="locked"{% endif %} data-doc-id="{{ d.id }}" data-title="{{ d.title }}" data-ext="{{ d.ext }}" data-url="{{ d.url }}" data-key="{{ d.key }}" data-uri="{{ d.uri }}" data-class="{{ d.kind }}" data-modified="{{ d.modified|default:'-' }}" data-size="{{ d.size|default:'-' }}" data-storage="{{ d.storage|default:'-' }}" data-etag="{{ d.etag|default:'-' }}" data-node="{{ d.node }}" data-access="{% if d.open %}open{% else %}locked{% endif %}" data-excerpt="{{ d.excerpt }}"{% if d.infobox_url %} data-infobox-url="{{ d.infobox_url }}"{% endif %}>
  <td data-sort="{{ d.title }}"><span class="ico ico-file" aria-hidden="true"></span><a href="{{ d.url }}">{{ d.title }}<span class="ext">{{ d.ext }}</span></a></td>
  <td>{{ d.kind }}</td>
  <td data-sort="{{ d.modified_sort }}">{{ d.modified|default:"-" }}</td>
  <td data-sort="{{ d.bytes }}">{{ d.size|default:"-" }}</td>
  <td>{{ d.storage|default:"-" }}</td>
  <td{% if d.open %} class="state-open"{% endif %}>{% if d.open %}OPEN{% else %}LOCKED{% endif %}</td>
</tr>
