{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}aether.db{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'wiki/wiki.css' %}">
</head>
<body>
<nav class="bar">
  <a class="bar-brand" href="{% url 'wiki:home' %}">aether.db</a>
  {% for c in crumbs %}<span class="sep">/</span><a href="{{ c.url }}">{{ c.name }}</a>{% endfor %}
</nav>
<main class="page">
{% block content %}{% endblock %}
</main>
</body>
</html>
