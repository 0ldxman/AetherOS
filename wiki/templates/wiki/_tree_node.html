<li>
{% if node.children %}
  <details data-ns="{{ node.id }}"{% if node.expanded %} open{% endif %}>
    <summary class="t-row{% if node.current %} current{% endif %}{% if not node.open %} locked{% endif %}">
      <a class="node" href="{{ node.url }}">{{ node.name }}</a>
      <span class="mark"></span>
    </summary>
    <ul>
    {% for child in node.children %}{% include "wiki/_tree_node.html" with node=child %}{% endfor %}
    </ul>
  </details>
{% else %}
  <div class="t-row{% if node.current %} current{% endif %}{% if not node.open %} locked{% endif %}">
    <a class="node" href="{{ node.url }}">{{ node.name }}</a>
  </div>
{% endif %}
</li>
