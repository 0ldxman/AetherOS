{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Terminal — {{ hostname }}</title>
    <link rel="stylesheet" href="{% static 'ui/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'ui/fonts.css' %}">
    <link rel="stylesheet" href="{% static 'ui/console.css' %}">
    <link rel="stylesheet" href="{% static 'terminal.css' %}">
</head>
<body>
    <main
        id="terminal"
        data-execute-url="{% url 'terminal:execute' %}"
        data-hostname="{{ hostname }}"
        data-login="{{ login }}"
        data-cwd="{{ cwd }}"
    >
        <div id="terminal-output" aria-live="polite"></div>

        <form id="terminal-form" autocomplete="off">
            <label id="terminal-prompt" for="terminal-input">
                {{ login }}@{{ hostname }}:~{% if cwd != '/' %}{{ cwd }}{% endif %}$
            </label>
            <input
                id="terminal-input"
                type="text"
                spellcheck="false"
                autocomplete="off"
                autofocus
            >
        </form>
    </main>

    {% csrf_token %}
    {{ greeting|json_script:"terminal-greeting" }}
    <script src="{% static 'ui/console.js' %}"></script>
    <script src="{% static 'terminal.js' %}"></script>
</body>
</html>
