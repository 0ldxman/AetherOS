{% extends "ui/base.html" %}
{% load static %}

{% block lang %}en{% endblock %}
{% block title %}forum{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{% static 'ui/apps.css' %}">
    <link rel="stylesheet" href="{% static 'forum/forum.css' %}">
{% endblock %}

{% block body %}
    <main id="forum"
          data-spaces-url="{% url 'forum:spaces' %}" data-space-url="{% url 'forum:space' 'SLUG' %}" data-section-url="{% url 'forum:section' 0 %}"
          data-topic-url="{% url 'forum:topic' 0 %}" data-new-topic-url="{% url 'forum:new_topic' %}" data-new-post-url="{% url 'forum:new_post' %}"
          data-new-section-url="{% url 'forum:new_section' %}" data-archive-url="{% url 'forum:archive_section' %}" data-hide-url="{% url 'forum:hide_post' %}"
          data-restore-url="{% url 'forum:restore_post' %}" data-flags-url="{% url 'forum:topic_flags' %}" data-files-url="{% url 'forum:files' %}" data-save-url="{% url 'forum:save_attachment' %}">

        <header class="fm-head">
            <div class="fm-title"><span class="fm-tag">[FORUM]</span><h1 id="fm-space">…</h1></div>
            <div id="fm-who" class="fm-who"></div>
        </header>

        <div class="fm-frame">
            {# доски пространства всегда под рукой: как список каналов #}
            <nav class="fm-rail" aria-label="boards">
                <div id="fm-rail"></div>
            </nav>
            <div class="fm-content">
                <nav class="fm-bar" aria-label="location">
                    <div id="fm-crumbs" class="fm-crumbs"></div>
                    <div id="fm-actions" class="fm-actions"></div>
                </nav>
                <section class="fm-scroll"><div id="fm-page" class="fm-page" aria-live="polite"></div></section>
            </div>
        </div>

        <div class="status" role="status"></div>
    </main>
{% endblock %}

{% block js %}
    <script src="{% static 'ui/apps.js' %}"></script>
    <script src="{% static 'forum/forum.js' %}"></script>
{% endblock %}
