    <header id="taskbar">
        <div class="connection">
            <span>conn: </span>
            <button
                type="button"
                id="session-menu-button"
                class="session-button"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="session-menu"
            >
                <span id="machine-name">{{ login }}@{{ machine_name }}</span>
                <span class="session-caret" aria-hidden="true">▾</span>
            </button>
            <ul id="session-menu" class="session-menu" role="menu" data-actions hidden>
                {% if can_sessions %}
                <li role="none">
                    <button type="button" role="menuitem" data-action="sessions" data-url="{{ sessions_url }}">sessions.mon</button>
                </li>
                {% endif %}
                <li role="none">
                    <button type="button" role="menuitem" data-action="reset-layout">reset layout</button>
                </li>
                <li role="none">
                    <button type="button" role="menuitem" data-action="disconnect" data-logout-url="{{ logout_url }}" data-lock-url="{{ lock_url }}">disconnect</button>
                </li>
            </ul>
        </div>
        <div class="ping">
                <span class="ping-dot"></span>
                <span id="ping-value">42</span>
                <span id="ping-unit">ms</span>
        </div>
    </header>

    <div id="clock-plate"> 
        <span id="clock"></span>
        <span id="date"></span>
    </div>
